sources:
  - name: demo_src
    description: Данные из БД авиаперелетов
    tables: 
    - name: aircrafts
      description: Модели самолетов
      columns: 
        - name: aircraft_code
          description: Код модели самолета
        - name: model
          description: Название модели самолета
        - name: range
    - name: airports
      description: Аэропорты
      columns: 
        - name: airport_code
          description: Код аэропорта
        - name: airport_name
          description: Название
        - name: city
          description: Город 
        - name: coordinates
          description: Координаты
        - name: timezone
          description: Временная зона
    - name: seats
      description: Места в самолетах
      columns: 
        - name: aircraft_code
          description: Код самолета
        - name: seat_no
          description: Номер места
        - name: fare_conditions
          description: Класс обслуживания
    - name: bookings
      description: Бронирования
      config:
        freshness: 
          warn_after:
            count: 90000

            period: hour
          error_after:
            count: 30000
            period: day
          filter: current_timestamp::date - book_date::date < 60000
        # changed to config in v1.10
        loaded_at_field: book_date::timestamp
        # or use loaded_at_query in v1.10 or higher. Should not be used if loaded_at_field is defined
      columns:
        - name: book_ref
        - name: book_date
        - name: total_amount
        



    



