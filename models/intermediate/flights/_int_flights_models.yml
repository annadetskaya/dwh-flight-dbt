models:
  - name: fct_booking
    description: Факты бронирований
    docs: 
      show: true
      node_color: red
    latest_version: 1
    versions:
      - v: 1
    config:
      contract: {enforced: true}
    meta: {owner: "yml_file_owner@gmail.com", status: in_dev, my_meta: new}

    columns:
      - name: book_ref
        data_type: varchar(8)
        constraints:
          - type: not_null
      - name: book_date
        data_type: timestamptz 
      - name: total_amount
        data_type: numeric(10, 2) 
        constraints:
          - type: check
            expression: "total_amount > 0"
      - name: booking_hk
        data_type: varchar(32)
        tests:
          - not_null

  - name: fct_ticket_flights
    description: Билеты на самолет
    docs: 
      show: true
      node_color: green
    latest_version: 1
    versions:
      - v: 1
    config:
      contract: {enforced: true}
    meta:
      owner: anyadetskaya@icloud.com

    columns:
      - name: ticket_no
        constraints:
          - type: not_null
        data_type: bpchar(13)
      - name: flight_id
        data_type: int4 
      - name: fare_conditions
        data_type: varchar(10)
      - name: amount
        data_type: numeric(10,2)
        constraints:
          - type: check
            expression: "amount > 0"
      - name: boarding_pass_exists
        data_type: text
      - name: boarding_no
        data_type: int4
      - name: seat_no
        data_type: varchar(4)
      - name: load_date
        data_type: date

  - name: fct_flights
    description: Факты по авиарейсам

    columns:
      - name: flight_id
        description: Идентификатор рейса
        data_type: int4

      - name: flight_no
        description: Номер рейса
        data_type: bpchar(6)

      - name: scheduled_departure
        description: Плановое время вылета
        data_type: timestamptz

      - name: scheduled_arrival
        description: Плановое время прибытия
        data_type: timestamptz

      - name: departure_airport_id
        description: Код аэропорта вылета
        data_type: bpchar(3)

      - name: arrival_airport_id
        description: Код аэропорта прибытия
        data_type: bpchar(3)

      - name: status
        description: Статус рейса
        data_type: varchar(20)

      - name: aircraft_id
        description: Код самолета
        data_type: bpchar(3)

      - name: actual_departure
        description: Фактическое время вылета
        data_type: timestamptz

      - name: actual_arrival
        description: Фактическое время прибытия
        data_type: timestamptz

      - name: load_date
        description: Дата загрузки данных
        data_type: date

      - name: flight_info
        description: Составной идентификатор рейса
        data_type: text

    tests:
      - dbt_utils.equal_rowcount:
          compare_model: ref('stg_flights__flights')